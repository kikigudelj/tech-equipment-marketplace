{% extends "advertisement/base.html" %}
{% load static %}

{% block title %}
Dodaj Proizvod
{% endblock %}

{% block content %}
<br><br><br>

<!-- Div za pozadinsku sliku koja pokriva cijeli ekran -->
<div class="background-image">
    <img src="{% static 'myapp/images/pozadina.jpg' %}" alt="Pozadinska slika" class="background-img">
</div>
<form class="add_product_form" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Predaj Oglas</button>
</form>
<br><br>
<style>
    .background-image {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1; 
        overflow: hidden;
    }

    .background-img {
        width: 100%; 
        height: 100%;
        object-fit: cover; 
        object-position: center; 
        position: absolute;
    }

    .add_product_form {
        position: relative;
        z-index: 1; 
        padding: 20px;
        background: rgba(255, 255, 255, 0.85); 
        border-radius: 10px;
        width: 50%;
        margin: 0 auto;
        margin-top: 50px; 
    }

    h2 {
        margin-bottom: 20px;
    }
</style>
{% endblock %}
