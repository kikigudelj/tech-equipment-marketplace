{% extends "advertisement/base.html" %}
{% load static %}

{% block title %}
Login
{% endblock %}

{% block content %}
<br><br><br><br><br><br><br><br>
<center>
    <div style="background-color: #1c1e24; padding: 40px; border-radius: 15px; box-shadow: 0 0 30px rgba(50, 205, 50, 0.5); max-width: 400px;">
        <h1 style="color: #32cd32; font-size: 36px; font-weight: bold; text-shadow: 2px 2px 8px black;"> PRIJAVI SE: </h1>
        {% for message in messages %}
        <h5 style="color: red; margin-top: 20px;">{{ message }}</h5>
        {% endfor %}
        <form method="POST" action="/login/" style="margin-top: 30px;">
            {% csrf_token %}
            <div style="text-align: left;">
                <label for="username" style="color: #32cd32; font-size: 18px;">Korisničko ime:</label>
                <input type="text" id="username" name="username" style="width: 100%; padding: 10px; margin-top: 10px; border-radius: 5px; border: none; background-color: #2e3036; color: white;">
            </div>
            <br>
            <div style="text-align: left;">
                <label for="password" style="color: #32cd32; font-size: 18px;">Lozinka:</label>
                <input type="password" id="password" name="password" style="width: 100%; padding: 10px; margin-top: 10px; border-radius: 5px; border: none; background-color: #2e3036; color: white;">
            </div>
            <br>
            <input type="submit" value="PRIJAVI SE" style="background-color: #28a745; color: white; font-size: 18px; padding: 15px 30px; border-radius: 50px; border: none; cursor: pointer; box-shadow: none; transition: background-color 0.3s ease;">
        </form>
        <p style="color: white; margin-top: 20px; font-size: 14px;">Još nemaš račun? <a href="{% url 'register' %}" style="color: #32cd32;">Registriraj se!</a></p>
    </div>
</center>
<br><br><br><br><br><br><br><br>
{% endblock %}
