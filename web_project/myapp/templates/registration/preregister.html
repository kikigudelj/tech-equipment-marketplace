{% extends "advertisement/base.html" %}
{% load static %}

{% block title %}
Preregister
{% endblock %}

{% block content %}
<br><br>
<br>

<div class="center-container">
  
    <div class="promo-text">
        <p class="cloud-text">Požuri i postani i ti dio OglasArene!</p>
    </div>

    <div class="left-image">
        <img src="{% static 'myapp/images/gladiator 3.png' %}" alt="Left Image" class="gladiator-img">
    </div>
    
    <div class="promo-content">
        <p class="promo-box">
            <b>PRIDRUŽI NAM SE!</b> <br><br>
            <a href="{% url 'register' %}"> 
                <button id="redirectButton" class="register-btn">Registriraj se</button>
            </a>
        </p>
        <p>Već imaš korisnički račun na OglasArena? <span style="margin: 5px;"></span> >>  <a href="{% url 'login' %}" style="color: #28a745;"> Prijavi se</a> </p>
    </div>
</div>

<style>
    body {
        font-family: 'Roboto', sans-serif;
        background-color: #f5f5f5; 
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    .center-container {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        min-height: 80vh;
        position: relative;
    }

    .promo-text {
        position: absolute;
        top: 10%; 
        width: 100%;
        text-align: center;
        color: #1b1717;
        font-size: 48px; 
        font-weight: 700; 
        text-shadow: 3px 3px 15px rgba(0, 0, 0, 0.8); 
        z-index: 2;
        letter-spacing: 3px; 
        animation: slideIn 2s ease-out; 
        padding: 0 10px; 
    }

    @keyframes slideIn {
        0% {
            opacity: 0;
            transform: translateY(-50px);
        }
        100% {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .left-image {
        flex: 1;
        padding-right: 20px;
        position: relative; 
        z-index: 1;
    }

    .gladiator-img {
        width: 100%;
        height: auto;
        
    }

    .promo-content {
        flex: 1;
        text-align: left;
        z-index: 2;
    }

    .promo-box {
        font-size: 24px;
        text-align: center;
        color: #333;
    }

    .register-btn {
        background-color: #28a745;
        color: white;
        font-size: 20px;
        padding: 15px 30px;
        border-radius: 50px;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .register-btn:hover {
        background-color: #218838;
    }
</style>

{% endblock %}
